<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">Payment</h2>
  <button (click)="simulatePayment()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
    Pay Now
  </button>
  <div *ngIf="paymentSuccess" class="mt-4 text-green-600 font-semibold">
    Payment successful! Your invitation will be sent to your email.
  </div>
</div>
