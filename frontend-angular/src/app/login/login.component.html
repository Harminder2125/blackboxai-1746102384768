<div class="container mx-auto p-4 max-w-md">
  <h2 class="text-2xl font-bold mb-4">Admin Login</h2>
  <form (ngSubmit)="login()">
    <label class="block mb-2 font-semibold">Email</label>
    <input type="email" [(ngModel)]="email" name="email" required class="w-full p-2 border rounded mb-4" />

    <label class="block mb-2 font-semibold">Password</label>
    <input type="password" [(ngModel)]="password" name="password" required class="w-full p-2 border rounded mb-4" />

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Login</button>
  </form>
  <div *ngIf="errorMessage" class="mt-4 text-red-600 font-semibold">{{ errorMessage }}</div>
</div>
