<div class="container mx-auto p-6 max-w-lg">
  <h1 class="text-3xl font-bold mb-4">Contact Us</h1>
  <form>
    <label class="block mb-2 font-semibold">Name</label>
    <input type="text" class="w-full p-2 border rounded mb-4" />

    <label class="block mb-2 font-semibold">Email</label>
    <input type="email" class="w-full p-2 border rounded mb-4" />

    <label class="block mb-2 font-semibold">Message</label>
    <textarea class="w-full p-2 border rounded mb-4"></textarea>

    <button type="submit" class="bg-navy text-white px-4 py-2 rounded hover:bg-blue-700 transition">Send</button>
  </form>
</div>
