<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold mb-6">Invitation Card Samples</h1>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
    <div *ngFor="let sample of invitationSamples" class="cursor-pointer border rounded-lg overflow-hidden shadow hover:shadow-lg transition-shadow duration-300" [routerLink]="['/invitation', sample.id]">
      <img [src]="sample.imageUrl" [alt]="sample.title" class="w-full h-48 object-cover" />
      <div class="p-4">
        <h2 class="text-xl font-semibold">{{ sample.title }}</h2>
      </div>
    </div>
  </div>
</div>
